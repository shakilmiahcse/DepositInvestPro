<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অফলাইন মোড | Offline Mode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #2d3748;
        }
        .offline-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        .icon-circle {
            width: 90px;
            height: 90px;
            background: #fee2e2;
            color: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
        }
        h2 {
            font-size: 22px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 10px;
        }
        p {
            font-size: 15px;
            color: #718096;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn-retry {
            display: inline-block;
            width: 100%;
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .btn-retry:hover, .btn-retry:active {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-circle">
            📡
        </div>
        <h2>ইন্টারনেট সংযোগ নেই</h2>
        <p>আপনার ইন্টারনেট সংযোগটি পরীক্ষা করুন। পুনরায় কানেক্ট হয়ে গেলে নিচের বাটনে চাপ দিন।<br><small style="color:#a0aec0;">You are currently offline.</small></p>
        <button class="btn-retry" onclick="window.location.reload();">
            🔄 পুনরায় চেষ্টা করুন (Retry)
        </button>
    </div>
</body>
</html>
